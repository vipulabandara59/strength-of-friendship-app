'use strict';

const KEY='sof_final_app_1';

const months=[

];

const base={

 address:'A 1/10 මැදගොඩ අමිතිරිගල',

 logo:'',
 constitution:'',
 pdf:'',
 bank:'',
 qr:'',

 memberFee:'රු. 2,000',
 deathFee:'රු. 1,000',
 joinFee:'',
 sick:'',
 familySick:'',
 special:'',

 paymentInfo:'',
 paymentForm:'',
 loanForm:'',

 password:'1234',

 members:Array.from(
  {length:30},
  (_,i)=>({
   no:i+1,
   name:'',
   phone:'',
   photo:''
  })
 ),

 loans:[],
 payments:[],

 calendar:Array.from(
  {length:12},
  ()=>({
   title:'',
   date:'',
   members:'',
   notes:''
  })
 ),

 reports:[],
 accounts:[],
 memories:[],
 notices:[],
 attendance:[],
 next:[]
};


let D=loadData();
let ADMIN=false;
let current='home';
let firebaseReady=false;


/* =====================================================
   LOCAL DATA
===================================================== */

function loadData(){

 try{

  const saved=localStorage.getItem(KEY);

  if(!saved){
   return JSON.parse(JSON.stringify(base));
  }

  const old=JSON.parse(saved);

  const data=JSON.parse(
   JSON.stringify(base)
  );

  Object.keys(old).forEach(k=>{
   data[k]=old[k];
  });

  return data;

 }catch(error){

  console.error(error);

  return JSON.parse(JSON.stringify(base));

 }

}


/* =====================================================
   FIREBASE
===================================================== */

window.addEventListener(
 "firebaseReady",
 async function(){

  firebaseReady=true;

  console.log("🔥 Firebase Ready");

  await loadCloudData();

 }
);


async function loadCloudData(){

 if(!window.firebaseDB){

  console.log("Firebase not ready");

  return;

 }

 try{

  const ref=window.firebaseDoc(
   window.firebaseDB,
   "appData",
   "main"
  );

  const snap=await window.firebaseGetDoc(ref);

  if(snap.exists()){

   const cloud=snap.data();

   const newData=
    JSON.parse(JSON.stringify(base));

   Object.keys(cloud).forEach(k=>{
    newData[k]=cloud[k];
   });

   D=newData;

   localStorage.setItem(
    KEY,
    JSON.stringify(D)
   );

   console.log(
    "✅ Cloud data loaded"
   );

   render();

  }else{

   console.log(
    "☁️ First setup: uploading current data"
   );

   await saveCloudOnly();

  }

 }catch(error){

  console.error(
   "❌ Cloud load error:",
   error
  );

 }

}


/* =====================================================
   SAVE EVERYTHING TO FIREBASE
===================================================== */

async function saveCloudOnly(){

 if(!window.firebaseDB)
  return false;

 try{

  const ref=window.firebaseDoc(
   window.firebaseDB,
   "appData",
   "main"
  );

  await window.firebaseSetDoc(
   ref,
   D
  );

  console.log(
   "✅ Main data saved to Firebase"
  );

  return true;

 }catch(error){

  console.error(
   "❌ Firebase save error:",
   error
  );

  alert(
   "Firebase Save කිරීමේදී ගැටලුවක් ඇති විය."
  );

  return false;

 }

}


/* =====================================================
   SAVE
===================================================== */

async function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(D)
 );

 if(window.firebaseDB){

  try{

   await saveCloudOnly();

  }catch(error){

   console.error(error);

  }

 }

 render();

}

/* =====================================================
   BASIC
===================================================== */

function e(x){

 return String(x??'').replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'
  }[m])
 );

}


function go(p){

 current=p;

 render();

 window.scrollTo(0,0);

}


function openM(x){

 mb.innerHTML=x;

 modal.classList.add('a');

}


function closeM(){

 modal.classList.remove('a');

}


/* =====================================================
   ADMIN
===================================================== */

function req(){

 if(ADMIN===true)
  return true;

 login();

 return false;

}


function login(){

 openM(`

 <h2>🔐 Admin Login</h2>

 <p>
 <b>Admin password එක ඇතුළත් කරන්න.</b>
 </p>

 <input
  id="pin"
  type="password"
  placeholder="Admin Password"
  autocomplete="off">

 <button
  class="btn blue"
  onclick="doLogin()">
  🔓 Login
 </button>

 `);

 setTimeout(()=>{

  const el=
   document.getElementById('pin');

  if(el)
   el.focus();

 },100);

}


function doLogin(){

 const el=
  document.getElementById('pin');

 if(!el)
  return;

 const entered=el.value;

 if(
  entered===
  String(D.password)
 ){

  ADMIN=true;

  closeM();

  render();

  alert(
   '✅ Admin Mode සක්‍රීයයි.'
  );

 }else{

  alert(
   '❌ Password වැරදියි.'
  );

  el.value='';

  el.focus();

 }

}


function A(x){

 return ADMIN===true ? x : '';

}


function logout(){

 ADMIN=false;

 closeM();

 current='home';

 render();

}


/* =====================================================
   DELETE
===================================================== */

async function del(a,i){

 if(!req())
  return;

 if(!Array.isArray(D[a]))
  return;

 if(
  confirm('Delete කරන්නද?')
 ){

  D[a].splice(i,1);

  await save();

 }

}


/* =====================================================
   FILE READER
===================================================== */

function fd(file,cb){

 if(!file){

  cb('');

  return;

 }

 const r=new FileReader();

 r.onload=()=>{
  cb(r.result);
 };

 r.onerror=()=>{
  cb('');
 };

 r.readAsDataURL(file);

}


/* =====================================================
   RENDER
===================================================== */

function render(){

 document
 .querySelectorAll('#nav button')
 .forEach(x=>{

  x.classList.toggle(
   'a',
   x.dataset.p===current
  );

 });

 main.innerHTML=
  pages.map(p=>`

   <section
    id="p-${p[0]}"
    class="page ${
     p[0]===current?'a':''
    }">
   </section>

  `).join('');

 home();
 members();
 constitution();
 bank();
 loans();
 payments();
 fees();
 calendar();

 list(
  'reports',
  '📊 මාසික වාර්තා',

  '🧾 මාසික ගිණුම් වාර්තා',
  D.accounts
 );

 memories();
 notices();
 attendance();
 online();
 next();
 admin();

}

function member(i){

 if(!req())
  return;

 if(i<0){

  i=D.members.findIndex(
   x=>!x.name&&!x.phone
  );

 }

 if(i<0){

  alert(
   'සාමාජිකයන් 30 දෙනාම භාවිතා කර ඇත.'
  );

  return;

 }

 const x=D.members[i];

 openM(`

 <h2>
  සාමාජික අංකය ${x.no}
 </h2>

 <input
  id="mn"
  value="${e(x.name)}"
  placeholder="සාමාජිකයාගේ නම">

 <input
  id="mp"
  value="${e(x.phone)}"
  placeholder="දුරකථන අංකය">

 <input
  id="mf"
  type="file"
  accept="image/*">

 ${
  x.photo
  ? `<img
      class="preview"
      src="${x.photo}">`
  : ''
 }

 <button
  class="btn blue"
  onclick="sm(${i})">
  💾 Save
 </button>

 `);

}


async function sm(i){

 if(!ADMIN)
  return;

 D.members[i].name=
  document.getElementById('mn').value;

 D.members[i].phone=
  document.getElementById('mp').value;

 const file=
  document.getElementById('mf').files[0];

 if(file){

  fd(
   file,
   async s=>{

    if(s)
     D.members[i].photo=s;

    await save();

    closeM();

   }
  );

 }else{

  await save();

  closeM();

 }

}

  x.photo
  ? `<img
      class="preview"
      src="${x.photo}">`
  : ''
 }

 <button
  class="btn blue"
  onclick="sm2(${i},'${type}')">
  💾 Save / Upload
 </button>

 `);

}


async function sm2(i,t){

 if(!ADMIN)
  return;

 let x=
  i<0
  ? {
     title:'',
     text:'',
     photo:''
    }
  : D[t][i];

 x.title=mt.value;
 x.text=mx.value;

 const file=
  document.getElementById(
   'mediaFile'
  ).files[0];

 if(file){

  fd(
   file,
   async s=>{

    if(s)
     x.photo=s;

    if(i<0)
     D[t].push(x);

    await save();

    closeM();

   }
  );

 }else{

  if(i<0)
   D[t].push(x);

  await save();

  closeM();

 }

}

async function saveSettings(){

 if(!ADMIN)
  return;

 D.address=ga.value;
 D.bank=gb.value;
 D.constitution=gc.value;

 D.memberFee=gm.value;
 D.deathFee=gd.value;
 D.joinFee=gj.value;

 D.sick=gs.value;
 D.familySick=gf.value;
 D.special=gx.value;

 D.paymentInfo=gpay.value;
 D.paymentForm=gform.value;
 D.loanForm=gloan.value;

 D.password=
  gp.value || '1234';


 const pdfFile=
  document.getElementById(
   'gpdf'
  ).files[0];

 const qrFile=
  document.getElementById(
   'gqr'
  ).files[0];


 if(pdfFile){

  fd(
   pdfFile,
   async s=>{

    if(s)
     D.pdf=s;

    if(qrFile){

     fd(
      qrFile,
      async q=>{

       if(q)
        D.qr=q;

       await save();

       closeM();

      }
     );

    }else{

     await save();

     closeM();

    }

   }
  );

 }else if(qrFile){

  fd(
   qrFile,
   async q=>{

    if(q)
     D.qr=q;

    await save();

    closeM();

   }
  );

 }else{

  await save();

  closeM();

 }

}

function backup(){

 if(!req())
  return;

 const a=
  document.createElement('a');

 a.href=
  URL.createObjectURL(
   new Blob(
    [JSON.stringify(D,null,2)],
    {
     type:'application/json'
    }
   )
  );

 a.download=
  'strength-of-friendship-backup.json';

 a.click();

}
