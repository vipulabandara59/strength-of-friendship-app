<script type="module">

import { initializeApp }

 doc,
 getDoc,
 setDoc,
 deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDm_RUNJFb3i5pitv5L8w2Tq7gG7asuDoQ",

 projectId:"strength-of-friendship",
 storageBucket:"strength-of-friendship.firebasestorage.app",

const app=initializeApp(firebaseConfig);

window.firebaseDB=db;

<script>
'use strict';

const KEY='sof_final_app_2';

const months=[
'ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්',
'මැයි','ජූනි','ජූලි','අගෝස්තු',
'සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'
];

const base={
 address:'A 1/10 මැදගොඩ අමිතිරිගල',
 logo:'',
 constitution:'',
 pdf:'',
 memberFee:'රු. 2,000',
 deathFee:'රු. 1,000',
 joinFee:'',
 sick:'',
 familySick:'',
 special:'',
 paymentInfo:'',
 paymentForm:'',
 loanForm:'',
 password:'1234',

 bankAccounts:[],

 members:Array.from(
  {length:30},
  (_,i)=>({
   id:String(i+1),
   no:i+1,
   name:'',
   phone:'',
   photo:''
  })
 ),

 loans:[],
 payments:[],

 calendar:Array.from(
  {length:12},
  ()=>({
   title:'',
   date:'',
   members:'',
   notes:''
  })
 ),

 reports:[],
 accounts:[],
 memories:[],
 notices:[],
 attendance:[],
 next:[]
};

let D=loadData();
let ADMIN=false;
let current='home';

function loadData(){

 try{

  const saved=JSON.parse(
   localStorage.getItem(KEY)
  );

  const data=JSON.parse(
   JSON.stringify(base)
  );

  if(saved){

   Object.keys(saved).forEach(k=>{
    data[k]=saved[k];
   });

  }

  if(!Array.isArray(data.bankAccounts))
   data.bankAccounts=[];

  if(!Array.isArray(data.reports))
   data.reports=[];

  if(!Array.isArray(data.accounts))
   data.accounts=[];

  if(!Array.isArray(data.memories))
   data.memories=[];

  return data;

 }catch(e){

  return JSON.parse(JSON.stringify(base));

 }

}

/* =========================
   FIREBASE
========================= */

async function loadCloud(){

 if(!window.firebaseDB)
  return;

 status.innerText='Firebase සම්බන්ධ වෙමින් පවතී...';

 try{

  const ref=window.firebaseDoc(
   window.firebaseDB,
   'appData',
   'main'
  );

  const snap=
   await window.firebaseGetDoc(ref);

  if(snap.exists()){

   const cloud=snap.data();

   Object.keys(cloud).forEach(k=>{
    D[k]=cloud[k];
   });

   localStorage.setItem(
    KEY,
    JSON.stringify(D)
   );

   status.innerText='🟢 Firebase සම්බන්ධයි';

   render();

  }else{

   await window.firebaseSetDoc(
    ref,
    D
   );

   status.innerText='🟢 Firebase සම්බන්ධයි';

  }

 }catch(error){

  console.error(error);

  status.innerText=
   '🔴 Firebase සම්බන්ධ කිරීමේ ගැටලුවක්';

 }

}

async function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(D)
 );

 if(window.firebaseDB){

  try{

   await window.firebaseSetDoc(
    window.firebaseDoc(
     window.firebaseDB,
     'appData',
     'main'
    ),
    D
   );

   status.innerText='🟢 Firebase වෙත සේව් විය';

  }catch(error){

   console.error(error);

   status.innerText=
    '🔴 Firebase එකට සේව් කිරීමේදී ගැටලුවක් පවතී';

   alert(
    'Firebase එකට සේව් කිරීමේදී ගැටලුවක් පවතී.'
   );

  }

 }

 render();

}

/* =========================
   FIREBASE MEMBERS
========================= */

window.addEventListener(
 'firebaseMembersLoaded',
 function(ev){

  const list=ev.detail;

  if(!Array.isArray(list))
   return;

  list.forEach((m,i)=>{

   if(i<D.members.length){

    D.members[i]={
     id:m.id||String(i+1),
     no:m.no||i+1,
     name:m.name||'',
     phone:m.phone||'',
     photo:m.photo||''
    };

   }

  });

  localStorage.setItem(
   KEY,
   JSON.stringify(D)
  );

  render();

 }
);

window.addEventListener(
 'firebaseReady',
 loadCloud
);

/* =========================
   NAV
========================= */

const pages=[
 ['home','මුල් පිටුව'],
 ['members','සාමාජිකයන්'],
 ['constitution','ව්‍යවස්ථාව'],
 ['bank','බැංකු'],
 ['loans','ණය'],
 ['payments','ගෙවීම්'],
 ['fees','වෙනත් විස්තර'],
 ['calendar','සුහද හමුව'],
 ['reports','වාර්තා'],
 ['accounts','ගිණුම්'],
 ['memories','අපේ මතකයන්'],
 ['notices','විශේෂ නිවේදන'],
 ['attendance','පැමිණීම'],
 ['online','Online'],
 ['next','ඉදිරි සමිති වාරය'],
 ['admin','Admin / Edit']
];

nav.innerHTML=pages.map(p=>`
<button
 data-p="${p[0]}"
 onclick="go('${p[0]}')">
 ${p[1]}
</button>
`).join('');

/* =========================
   HELPERS
========================= */

function e(x){

 return String(x??'').replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'
  }[m])
 );

}

function p(id){

 return document.getElementById(
  'p-'+id
 );

}

function go(x){

 current=x;
 render();
 window.scrollTo(0,0);

}

function openM(x){

 mb.innerHTML=x;
 modal.classList.add('a');

}

function closeM(){

 modal.classList.remove('a');

}

function req(){

 if(ADMIN)
  return true;

 login();
 return false;

}

function fd(file,cb){

 if(!file){
  cb('');
  return;
 }

 const reader=new FileReader();

 reader.onload=()=>{
  cb(reader.result);
 };

 reader.readAsDataURL(file);

}

function deleteItem(arr,index){

 if(!req())
  return;

 if(confirm('Delete කරන්නද?')){

  D[arr].splice(index,1);
  save();

 }

}

/* =========================
   ADMIN
========================= */

function login(){

 openM(`

 <h2>🔐 Admin Login</h2>

 <p><b>Admin password එක ඇතුළත් කරන්න.</b></p>

 <input
  id="pin"
  type="password"
  placeholder="Admin Password">

 <button
  class="btn blue"
  onclick="doLogin()">
  🔓 Login
 </button>

 `);

 setTimeout(()=>{
  if(pin) pin.focus();
 },100);

}

function doLogin(){

 if(
  pin.value===
  String(D.password)
 ){

  ADMIN=true;
  closeM();
  render();

  alert('✅ Admin Mode සක්‍රීයයි.');

 }else{

  alert('❌ Password වැරදියි.');
  pin.value='';
  pin.focus();

 }

}

function logout(){

 ADMIN=false;
 go('home');

}

/* =========================
   RENDER
========================= */

function render(){

 nav.querySelectorAll('button')
 .forEach(b=>{
  b.classList.toggle(
   'a',
   b.dataset.p===current
  );
 });

 main.innerHTML=pages.map(x=>`
 <section
  id="p-${x[0]}"
  class="page ${x[0]===current?'a':''}">
 </section>
 `).join('');

 home();
 members();
 constitution();
 bank();
 loans();
 payments();
 fees();
 calendar();
 reports();
 accounts();
 memories();
 notices();
 attendance();
 online();
 next();
 admin();

}

/* =========================
   MEMBERS
========================= */

function members(){

 p('members').innerHTML=`

 <div class="card">

  <h2>👥 සාමාජිකයන් 30</h2>

  ${
   ADMIN
   ? `<button
       class="btn blue"
       onclick="member(-1)">
       + Add
      </button>`
   :''
  }

  ${
   !ADMIN
   ? `<div class="viewonly">
      🔒 සාමාන්‍ය පරිශීලකයන්ට සාමාජික විස්තර
      වෙනස් කළ නොහැක.
     </div>`
   :''
  }

 </div>

 <div class="grid">

 ${
  D.members.map((x,i)=>`

   <div class="card">

    <div class="photo">

     ${
      x.photo
      ? `<img src="${x.photo}">`
      :'📷'
     }

    </div>

    <span class="tag">
     අංකය ${e(x.no)}
    </span>

    <h3>
     ${e(x.name)||'නම ඇතුළත් කර නැත'}
    </h3>

    <p>📞 ${e(x.phone)}</p>

    ${
     ADMIN
     ? `
      <button
       class="btn blue"
       onclick="member(${i})">
       Edit
      </button>

      <button
       class="btn red"
       onclick="deleteItem('members',${i})">
       Delete
      </button>
     `
     :''
    }

   </div>

  `).join('')
 }

 </div>

 `;

}

function member(i){

 if(!req()) return;

 if(i<0){

  i=D.members.findIndex(
   x=>!x.name&&!x.phone
  );

 }

 if(i<0){

  alert('සාමාජිකයන් 30 දෙනාම භාවිතා කර ඇත');
  return;

 }

 const x=D.members[i];

 openM(`

 <h2>සාමාජික අංකය ${e(x.no)}</h2>

 <input
  id="mn"
  value="${e(x.name)}"
  placeholder="සාමාජිකයාගේ නම">

 <input
  id="mp"
  value="${e(x.phone)}"
  placeholder="දුරකථන අංකය">

 <input
  id="mfile"
  type="file"
  accept="image/*">

 ${
  x.photo
  ? `<img class="preview" src="${x.photo}">`
  :''
 }

 <button
  class="btn blue"
  onclick="saveMember(${i})">
  💾 Save
 </button>

 `);

}

function saveMember(i){

 if(!ADMIN) return;

 D.members[i].name=mn.value;
 D.members[i].phone=mp.value;

 fd(
  mfile.files[0],
  async s=>{

   if(s)
    D.members[i].photo=s;

   await save();
   closeM();

  }
 );

}

 ${

    ${

     ? `

    }

  `).join('')

async function filesToData(files){

 const arr=[];

 for(const file of files){

  const value=
   await new Promise(resolve=>{

    const r=new FileReader();

    r.onload=()=>{
     resolve(r.result);
    };

    r.readAsDataURL(file);

   });

  arr.push(value);

 }

 return arr;

}

async function saveMemory(i){

 const x=i<0
  ? {title:'',text:'',photos:[]}
  : D.memories[i];

 x.title=mTitle.value;
 x.text=mText.value;

 if(mPhotos.files.length){

  const newPhotos=
   await filesToData(
    Array.from(mPhotos.files)
   );

  x.photos=[
   ...(x.photos||[]),
   ...newPhotos
  ];

 }

 if(i<0)
  D.memories.push(x);

 await save();
 closeM();

}

function markMyAttendance(){

 openM(`

 <p>
  ඔබගේ සාමාජික අංකය සහ නම ඇතුළත් කරන්න.

  id="myName"
  placeholder="ඔබගේ නම">

  id="myDate"
  type="date"

function saveMyAttendance(){

 const no=myNo.value.trim();
 const name=myName.value.trim();
 const date=myDate.value;

 if(!no||!name||!date){

  alert('සාමාජික අංකය, නම සහ දිනය ඇතුළත් කරන්න.');
  return;

 }

 const already=D.attendance.some(
  x=>String(x.no)===String(no)&&x.date===date
 );

 if(already){

  alert('මෙම දිනයට ඔබගේ පැමිණීම දැනටමත් Mark කර ඇත.');
  return;

 }

 D.attendance.push({
  no:no,
  name:name,
  date:date,
  time:new Date().toLocaleTimeString()
 });

 save();
 closeM();

 alert('✅ ඔබගේ පැමිණීම සාර්ථකව Mark විය.');

}

 }

  id="gm"
  value="${e(D.memberFee)}">

 <label>මරණාධාර ගාස්තුව</label>

  id="gd"
  value="${e(D.deathFee)}">

 <label>ඇතුළත් වීමේ ගාස්තුව</label>

  value="${e(D.joinFee)}">

 <textarea id="gs">${e(D.sick)}</textarea>

 <label>බිරිඳ / දරුවන් අසනීප වූ විට</label>

 <textarea id="gf">${e(D.familySick)}</textarea>

 <label>විශේෂ සටහන්</label>

 <textarea id="gx">${e(D.special)}</textarea>

 <label>Admin Password</label>

 <input
  id="gp"
  type="password"
  value="${e(D.password)}">

 <button
  class="btn blue"
  onclick="saveSettings()">
  💾 Save All
 </button>

 `);

}

function saveSettings(){

 if(!ADMIN) return;

 D.address=ga.value;
 D.constitution=gc.value;

 D.paymentInfo=gpay.value;
 D.paymentForm=gform.value;
 D.loanForm=gloan.value;

 D.memberFee=gm.value;
 D.deathFee=gd.value;
 D.joinFee=gj.value;

 D.sick=gs.value;
 D.familySick=gf.value;
 D.special=gx.value;

 D.password=gp.value||'1234';

 let total=0;

 if(gpdf.files.length)
  total++;

 if(gqr.files.length)
  total++;

 function done(){

  total--;

  if(total===0){

   save();
   closeM();

  }

 }

 if(gpdf.files.length){

  fd(
   gpdf.files[0],
   s=>{
    D.pdf=s;
    done();
   }
  );

 }

 if(gqr.files.length){

  fd(
   gqr.files[0],
   s=>{
    D.qr=s;
    done();
   }
  );

 }

 if(total===0){

  save();
  closeM();

 }

}
