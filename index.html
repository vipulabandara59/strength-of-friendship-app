/* ==============================
   IMAGE COMPRESS
============================== */

function compressImage(file,max=900,quality=.65){
 return new Promise((resolve,reject)=>{
  if(!file){
   resolve("");
   return;
  }

  const reader=new FileReader();

  reader.onload=e=>{
   const img=new Image();

   img.onload=()=>{
    let w=img.width;
    let h=img.height;

    if(w>max || h>max){
     if(w>h){
      h=Math.round(h*max/w);
      w=max;
     }else{
      w=Math.round(w*max/h);
      h=max;
     }
    }

    const canvas=document.createElement("canvas");
    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    resolve(canvas.toDataURL("image/jpeg",quality));
   };

   img.onerror=reject;
   img.src=e.target.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function loadCollection(name){
 const snap=await getDocs(collection(db,name));
 return snap.docs.map(x=>({
  id:x.id,
  ...x.data()
 }));
}

  if(s.exists()){
   settings={...settings,...s.data()};
  }

  members=await loadCollection("members");
  banks=await loadCollection("banks");
  loans=await loadCollection("loans");
  payments=await loadCollection("payments");
  calendar=await loadCollection("calendar");
  reports=await loadCollection("reports");
  accounts=await loadCollection("accounts");
  memories=await loadCollection("memories");

  notices=await loadCollection("notices");
  attendance=await loadCollection("attendance");

  /*

     අවශ්‍ය මූලික දත්ත අලුත් system එකට
     එකවර ගෙන එයි.
  */

  const old=await getDoc(doc(db,"appData","main"));

  if(old.exists()){

   const x=old.data();

   if(!s.exists()){

    settings={
     ...settings,
     address:x.address||settings.address,
     memberFee:x.memberFee||settings.memberFee,
     deathFee:x.deathFee||settings.deathFee,
     password:x.password||settings.password,
     paymentInfo:x.paymentInfo||"",
     paymentForm:x.paymentForm||"",
     loanForm:x.loanForm||"",
     constitution:x.constitution||"",
     logo:x.logo||"",
     next:""
    };

    await setDoc(
     doc(db,"settings","main"),
     settings
    );
   }

   if(!members.length && Array.isArray(x.members)){

    for(const m of x.members){

     if(m.name || m.phone){

      await setDoc(
       doc(db,"members",m.id||uid()),
       {
        no:m.no||"",
        name:m.name||"",
        phone:m.phone||"",
        photo:m.photo||""
       }
      );
     }
    }

    members=await loadCollection("members");
   }

  }

  setStatus("🟢 Firebase සම්බන්ධයි");

  render();

 }catch(err){

  console.error(err);
  setStatus("🔴 Firebase සම්බන්ධ කිරීමේ ගැටලුවක්");

  );
 }
}

window.saveMember=async function(id){

 if(!ADMIN)return;

 const old=members.find(x=>x.id===id)||{
  id:id,
  photo:""
 };

 let photo=old.photo||"";

 if($("mphoto").files[0]){
  photo=await compressImage(
   $("mphoto").files[0]
  );
 }

 const data={
  no:$("mno").value.trim(),
  name:$("mname").value.trim(),
  phone:$("mphone").value.trim(),
  photo:photo
 };

 if(await saveDoc("members",id,data)){

  closeModal();
  await refresh();
 }
};

window.saveMemory=async function(id){

 if(!ADMIN)return;

 const data={
  title:$("memoryTitle").value,
  date:$("memoryDate").value,
  description:$("memoryDescription").value
 };

 if(!await saveDoc("memories",id,data))
  return;

 const files=[
  ...$("memoryFiles").files
 ];

 for(let i=0;i<files.length;i++){

  const photo=await compressImage(
   files[i],
   850,
   .60
  );

  await saveDoc(
   "memoryPhotos",
   uid(),
   {
    memoryId:id,
    data:photo,
    order:i
   }
  );
 }

 closeModal();
 await refresh();
};

window.deleteMemory=async function(id){

 if(!adminRequired())return;

 if(!confirm("මෙම මතකය Delete කරන්නද?"))
  return;

 try{

  await deleteDoc(
   doc(db,"memories",id)
  );

  const photos=memoryPhotos.filter(
   x=>x.memoryId===id
  );

  for(const p of photos){

   await deleteDoc(
    doc(db,"memoryPhotos",p.id)
   );

  }

  await refresh();

 }catch(e){

  console.error(e);
  alert("Delete කිරීමේදී ගැටලුවක් ඇතිවිය.");
 }
};

 <h3>අද: ${today()}</h3>

 <select id="attendanceMember">

 <option value="">
 සාමාජිකයා තෝරන්න
 </option>

 ${
 members.map(m=>`

 <option value="${m.id}">
 ${esc(m.no)} - ${esc(m.name)}
 </option>

 `).join("")
 }

 </select>

 <button
 class="btn green"
 onclick="markAttendance()">
 ✅ අද පැමිණීම Mark කරන්න
 </button>

 </div>

 <div class="card">

 <h3>අද පැමිණි සාමාජිකයන්</h3>

 ${
 attendance.filter(x=>x.date===today()).length
 ? `<table>

 <tr>
 <th>අංකය</th>
 <th>නම</th>
 <th>දිනය</th>
 </tr>

 ${
 attendance
 .filter(x=>x.date===today())
 .map(x=>`

 <tr>
 <td>${esc(x.no)}</td>
 <td>${esc(x.name)}</td>
 <td>${esc(x.date)}</td>
 </tr>

 `).join("")
 }

 </table>`
 : `<div class="empty">අද පැමිණීමක් Mark කර නැත.</div>`
 }

 </div>
 `;
}

window.markAttendance=async function(){

 const memberId=$("attendanceMember").value;

 if(!memberId){

  alert("සාමාජිකයෙකු තෝරන්න.");
  return;
 }

 const m=members.find(x=>x.id===memberId);

 const id=today()+"_"+memberId;

 const exists=attendance.find(
  x=>x.id===id
 );

 if(exists){

  alert("මෙම සාමාජිකයා අද පැමිණීම Mark කර ඇත.");
  return;
 }

 const data={
  memberId:memberId,
  no:m?.no||"",
  name:m?.name||"",
  date:today(),
  markedAt:new Date().toISOString()
 };

 if(await saveDoc("attendance",id,data)){

  alert("✅ පැමිණීම Mark විය.");

  await refresh();
 }
};

function render(){

 pages.forEach(x=>{

  const el=$("p-"+x[0]);

  if(el)
   el.classList.toggle(
    "active",
    x[0]===current
   );

  const b=$("nav-"+x[0]);

  if(b)
   b.classList.toggle(
    "active",
    x[0]===current
   );
 });

 if(current==="home")home();
 if(current==="members")membersPage();
 if(current==="constitution")constitutionPage();
 if(current==="bank")bankPage();
 if(current==="loans")loansPage();
