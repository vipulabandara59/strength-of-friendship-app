<script>
'use strict';

const KEY='sof_final_app_1';

const months=[
'ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්','මැයි','ජූනි',
'ජූලි','අගෝස්තු','සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'
];

const base={
 address:'A 1/10 මැදගොඩ අමිතිරිගල',
 logo:'',
 constitution:'',
 pdf:'',
 bank:'',
 qr:'',
 memberFee:'රු. 2,000',
 deathFee:'රු. 1,000',
 joinFee:'',
 sick:'',
 familySick:'',
 special:'',
 paymentInfo:'',
 paymentForm:'',
 loanForm:'',
 password:'1234',

 members:Array.from(
  {length:30},
  (_,i)=>({
   no:i+1,
   name:'',
   phone:'',
   photo:''
  })
 ),

 loans:[],
 payments:[],

 calendar:Array.from(
  {length:12},
  ()=>({
   title:'',
   date:'',
   members:'',
   notes:''
  })
 ),

 reports:[],
 accounts:[],
 memories:[],
 notices:[],
 attendance:[],
 next:[]
};

let D=loadData();
let ADMIN=false;
let current='home';

function loadData(){

 try{

  const saved=JSON.parse(
   localStorage.getItem(KEY)
  );

  if(!saved)
   return JSON.parse(JSON.stringify(base));

  const data=JSON.parse(
   JSON.stringify(base)
  );

  Object.keys(saved).forEach(k=>{
   data[k]=saved[k];
  });

  return data;

 }catch(err){

  return JSON.parse(JSON.stringify(base));

 }

}

/* =========================
   FIREBASE LOAD
========================= */

async function loadFirebaseData(){

 if(!window.firebaseDB)
   return;

 try{

  const ref=window.firebaseDoc(
   window.firebaseDB,
   "appData",
   "main"
  );

  const snap=await window.firebaseGetDoc(ref);

  if(snap.exists()){

   const cloudData=snap.data();

   const newData=
    JSON.parse(JSON.stringify(base));

   Object.keys(cloudData).forEach(k=>{
    newData[k]=cloudData[k];
   });

   D=newData;

   localStorage.setItem(
    KEY,
    JSON.stringify(D)
   );

   console.log("✅ Firebase data loaded");

   render();

  }else{

   await window.firebaseSetDoc(
    ref,
    D
   );

   console.log(
    "✅ Initial data uploaded to Firebase"
   );

  }

 }catch(error){

  console.error(
   "❌ Firebase load error:",
   error
  );

 }

}

window.addEventListener(
 "firebaseReady",
 function(){

  loadFirebaseData();

 }
);

window.addEventListener(
 "firebaseMembersLoaded",
 function(e){

  const list=e.detail;

  if(!Array.isArray(list))
   return;

  list.forEach((member,index)=>{

   if(index<D.members.length){

    D.members[index]={
     no:member.no || index+1,
     name:member.name || '',
     phone:member.phone || '',
     photo:member.photo || ''
    };

   }

  });

  render();

 }
);

/* =========================
   PAGES
========================= */

const pages=[
 ['home','මුල් පිටුව'],
 ['members','සාමාජිකයන්'],
 ['constitution','ව්‍යවස්ථාව'],
 ['bank','බැංකු'],
 ['loans','ණය'],
 ['payments','ගෙවීම්'],
 ['fees','වෙනත් විස්තර'],
 ['calendar','සුහද හමුව'],
 ['reports','වාර්තා'],
 ['accounts','ගිණුම්'],
 ['memories','අපේ මතකයන්'],
 ['notices','විශේෂ නිවේදන'],
 ['attendance','පැමිණීම'],
 ['online','Online'],
 ['next','ඉදිරි සමිති වාරය'],
 ['admin','Admin / Edit']
];

nav.innerHTML=pages.map(p=>`
<button data-p="${p[0]}" onclick="go('${p[0]}')">
${p[1]}
</button>
`).join('');

/* =========================
   BASIC
========================= */

function e(x){

 return String(x??'').replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'
  }[m])
 );

}

function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(D)
 );

 if(window.firebaseDB){

  window.firebaseSetDoc(
   window.firebaseDoc(
    window.firebaseDB,
    "appData",
    "main"
   ),
   D
  )
  .then(()=>{
   console.log(
    "✅ Data saved to Firebase"
   );
  })
  .catch(error=>{
   console.error(
    "❌ Firebase save error:",
    error
   );
  });

 }

 render();

}

function go(p){

 current=p;
 render();
 window.scrollTo(0,0);

}

function openM(x){

 mb.innerHTML=x;
 modal.classList.add('a');

}

function closeM(){

 modal.classList.remove('a');

}

/* =========================
   ADMIN
========================= */

function req(){

 if(ADMIN===true)
  return true;

 login();
 return false;

}

function login(){

 openM(`

 <h2>🔐 Admin Login</h2>

 <p><b>
 Admin password එක ඇතුළත් කරන්න.
 </b></p>

 <input
  id="pin"
  type="password"
  placeholder="Admin Password"
  autocomplete="off"
 >

 <button
  class="btn blue"
  onclick="doLogin()">
  🔓 Login
 </button>

 `);

 setTimeout(()=>{

  const el=document.getElementById('pin');

  if(el) el.focus();

 },100);

}

function doLogin(){

 const entered=
  document.getElementById('pin').value;

 if(entered===String(D.password)){

  ADMIN=true;

  closeM();
  render();

  alert('✅ Admin Mode සක්‍රීයයි.');

 }else{

  alert('❌ Password වැරදියි.');

  const el=
   document.getElementById('pin');

  if(el){

   el.value='';
   el.focus();

  }

 }

}

function A(x){

 return ADMIN===true ? x : '';

}

function del(a,i){

 if(!req()) return;

 if(!Array.isArray(D[a]))
  return;

 if(confirm('Delete කරන්නද?')){

  D[a].splice(i,1);
  save();

 }

}

function logout(){

 ADMIN=false;
 closeM();
 go('home');

}

/* =========================
   FILE
========================= */

function fd(file,cb){

 if(!file){

  cb('');
  return;

 }

 const r=new FileReader();

 r.onload=()=>{
  cb(r.result);
 };

 r.readAsDataURL(file);

}

/* =========================
   RENDER
========================= */

function render(){

 document
 .querySelectorAll('#nav button')
 .forEach(x=>{

  x.classList.toggle(
   'a',
   x.dataset.p===current
  );

 });

 main.innerHTML=pages.map(p=>`

 <section
  id="p-${p[0]}"
  class="page ${p[0]===current?'a':''}">
 </section>

 `).join('');

 home();
 members();
 constitution();
 bank();
 loans();
 payments();
 fees();
 calendar();

 list(
  'reports',
  '📊 මාසික වාර්තා',
  D.reports
 );

 list(
  'accounts',
  '🧾 මාසික ගිණුම් වාර්තා',
  D.accounts
 );

 memories();
 notices();
 attendance();
 online();
 next();
 admin();

}

/* =========================
   MEMBERS
========================= */

function members(){

 p('members').innerHTML=`

 <div class="card">

  <h2>👥 සාමාජිකයන් 30</h2>

  ${A(`
   <button
    class="btn blue"
    onclick="member(-1)">
    + Add
   </button>
  `)}

  ${
   !ADMIN
   ? `<div class="viewonly">
      🔒 සාමාන්‍ය පරිශීලකයන්ට සාමාජික විස්තර
      වෙනස් කළ නොහැක.
     </div>`
   : ''
  }

 </div>

 <div class="grid">

 ${
  D.members.map((x,i)=>`

   <div class="card">

    <div class="photo">

     ${
      x.photo
      ? `<img src="${x.photo}">`
      : '📷'
     }

    </div>

    <span class="tag">
     අංකය ${e(x.no)}
    </span>

    <h3>
     ${e(x.name)||'නම ඇතුළත් කර නැත'}
    </h3>

    <p>📞 ${e(x.phone)}</p>

    ${A(`
     <button
      class="btn blue"
      onclick="member(${i})">
      Edit
     </button>

     <button
      class="btn red"
      onclick="del('members',${i})">
      Delete
     </button>
    `)}

   </div>

 `).join('')
 }

 </div>

 `;

}

function member(i){

 if(!req()) return;

 if(i<0){

  i=D.members.findIndex(
   x=>!x.name&&!x.phone
  );

 }

 if(i<0){

  alert(
   'සාමාජිකයන් 30 දෙනාම භාවිතා කර ඇත'
  );

  return;

 }

 const x=D.members[i];

 openM(`

 <h2>සාමාජික අංකය ${x.no}</h2>

 <input
  id="mn"
  value="${e(x.name)}"
  placeholder="සාමාජිකයාගේ නම">

 <input
  id="mp"
  value="${e(x.phone)}"
  placeholder="දුරකථන අංකය">

 <input
  id="mf"
  type="file"
  accept="image/*">

 ${
  x.photo
  ? `<img class="preview" src="${x.photo}">`
  : ''
 }

 <button
  class="btn blue"
  onclick="sm(${i})">
  💾 Save
 </button>

 `);

}

function sm(i){

 if(!ADMIN) return;

 D.members[i].name=mn.value;
 D.members[i].phone=mp.value;

 fd(
  mf.files[0],
  s=>{

   if(s)
    D.members[i].photo=s;

   save();
   closeM();

  }
 );

}

  type="date"

 <input

 <label>සාමාජිකයෙකු අසනීප වූ විට</label>

 <textarea id="gx">${e(D.special)}</textarea>

 <label>Online Payment විස්තර</label>

 <textarea id="gpay">${e(D.paymentInfo)}</textarea>

 <label>Payment Google Form</label>

 <input
  id="gform"
  value="${e(D.paymentForm)}">

 <label>Loan Google Form</label>

 <input
  id="gloan"
  value="${e(D.loanForm)}">

 <label>Admin Password</label>

 <input
  id="gp"
  type="password"
  value="${e(D.password)}">

 <button
  class="btn blue"
  onclick="saveSettings()">
  💾 Save All
 </button>

 `);

}

function saveSettings(){

 if(!ADMIN) return;

 D.address=ga.value;
 D.bank=gb.value;
 D.constitution=gc.value;

 D.memberFee=gm.value;
 D.deathFee=gd.value;
 D.joinFee=gj.value;

 D.sick=gs.value;
 D.familySick=gf.value;
 D.special=gx.value;

 D.paymentInfo=gpay.value;
 D.paymentForm=gform.value;
 D.loanForm=gloan.value;

 D.password=gp.value||'1234';

 let n=0;

 function done(){

  n--;

  if(n===0){

   save();
   closeM();

  }

 }

 if(gpdf.files[0]){

  n++;

  fd(
   gpdf.files[0],
   s=>{
    D.pdf=s;
    done();
   }
  );

 }

 if(gqr.files[0]){

  n++;

  fd(
   gqr.files[0],
   s=>{
    D.qr=s;
    done();
   }
  );

 }

 if(n===0){

  save();
  closeM();

 }

}
