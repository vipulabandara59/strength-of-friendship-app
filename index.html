async function getCollection(name){

 const snap=await getDocs(
  collection(db,name)
 );

 return snap.docs.map(d=>({
  id:d.id,
  ...d.data()
 }));

}

async function saveDocument(collectionName,id,data){

 await setDoc(
  doc(db,collectionName,id),
  data,
  {merge:true}
 );

}

async function deleteDocument(collectionName,id){

 await deleteDoc(
  doc(db,collectionName,id)
 );

}


/* =====================================================
   IMAGE COMPRESSION
   IMPORTANT:
   Images are compressed before Firestore saving.
===================================================== */

function imageToDataURL(file,maxSize=650,quality=.45){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onload=()=>{

   const img=new Image();

   img.onload=()=>{

    let scale=Math.min(
     1,
     maxSize/Math.max(img.width,img.height)
    );

    const canvas=document.createElement("canvas");

    canvas.width=Math.max(1,
     Math.round(img.width*scale)
    );

    canvas.height=Math.max(1,
     Math.round(img.height*scale)
    );

    const ctx=canvas.getContext("2d");

    ctx.drawImage(
     img,
     0,
     0,
     canvas.width,
     canvas.height
    );

    resolve(
     canvas.toDataURL(
      "image/jpeg",
      quality
     )
    );

   };

   img.onerror=reject;
   img.src=reader.result;

  };

  reader.onerror=reject;
  reader.readAsDataURL(file);

 });

}

async function loadSettings(){

 try{

  const mainRef=doc(db,"appData","main");
  const mainSnap=await getDoc(mainRef);

  if(mainSnap.exists()){
   D={
    ...D,
    ...mainSnap.data()
   };
  }else{

   const oldRef=doc(db,"appData","settings");
   const oldSnap=await getDoc(oldRef);

   if(oldSnap.exists()){
    D={
     ...D,
     ...oldSnap.data()
    };
   }

  }

  if(!Array.isArray(D.calendar) ||
     D.calendar.length!==12){

   D.calendar=
    JSON.parse(
     JSON.stringify(defaultData.calendar)
    );

  }

  loading=false;

  render();

 }catch(error){

  console.error(error);

  loading=false;

  render();

  showStatus(
   "❌ Firebase දත්ත ලබාගැනීමේදී ගැටලුවක් ඇත.",

 }

}

window.saveMemory=async function(x){

 try{

  let photos=
   Array.isArray(x.photos)?
   [...x.photos]:
   [];

  const files=
   Array.from(
    document.getElementById("memoryPhotos").files
   );

  for(const file of files){

   const compressed=
    await imageToDataURL(
     file,
     550,
     .35
    );

   photos.push(compressed);

  }

  const data={
   title:document.getElementById("memoryTitle").value.trim(),
   text:document.getElementById("memoryText").value.trim(),
   photos:photos
  };

  /*
    Check approximate size.
    Prevents Firestore 1MB document errors.
  */

  const bytes=
   new Blob([JSON.stringify(data)]).size;

  if(bytes>850000){

   alert(
    "❌ ඡායාරූප ගොඩක් නිසා මෙම මතකය විශාල වැඩියි.\n\n"+
    "ඡායාරූප අඩු ගණනකින් නැවත Save කරන්න."
   );

   return;

  }

  if(x.id){

   await saveDocument(
    "memories",
    x.id,
    data
   );

  }else{

   await addDoc(
    collection(db,"memories"),
    data
   );

  }

  closeModal();

  alert("✅ අපේ මතකය Firebase වෙත Save විය.");

  render();

 }catch(error){

  alert(
   "❌ Memory Save Error\n\n"+
   error.message
  );

 }

};

window.markAttendance=async function(){

 openModal(`

 <h2>✅ මගේ පැමිණීම</h2>

 <label>සාමාජිකයා</label>

 <select id="attendanceMember">

  <option value="">
   -- ඔබගේ නම තෝරන්න --
  </option>

 </select>

 <label>දිනය</label>

 <input id="attendanceDate"
 type="date"
 value="${today()}">

 <button class="btn green"
 onclick="saveAttendance()">
 ✅ පැමිණීම Mark කරන්න
 </button>

 `);

 try{

  const list=
   await getCollection("members");

  list
  .filter(x=>x.name)
  .sort(
   (a,b)=>
   (Number(a.no)||999)-
   (Number(b.no)||999)
  )
  .forEach(x=>{

   const option=
    document.createElement("option");

   option.value=
    JSON.stringify({
     no:x.no,
     name:x.name
    });

   option.textContent=
    "අංකය "+x.no+
    " — "+x.name;

   document
    .getElementById("attendanceMember")
    .appendChild(option);

  });

 }catch(error){

  alert(
   "❌ සාමාජික ලැයිස්තුව ලබාගත නොහැක."
  );

 }

};


window.saveAttendance=async function(){

 try{

  const value=
   document.getElementById(
    "attendanceMember"
   ).value;

  if(!value){

   alert("කරුණාකර ඔබගේ නම තෝරන්න.");
   return;

  }

  const member=
   JSON.parse(value);

  const date=
   document.getElementById(
    "attendanceDate"
   ).value;

  await addDoc(
   collection(db,"attendance"),
   {
    memberNo:String(member.no),
    name:String(member.name),
    date:date,
    status:"පැමිණ ඇත"
   }
  );

  closeModal();

  alert(
   "✅ ඔබගේ පැමිණීම Mark විය."
  );

  render();

  alert(

   error.message
  );

 }

};

window.removeItem=async function(collectionName,id){

 if(!requireAdmin())return;

 if(!confirm("මෙය Delete කරන්නද?")){
  return;
 }

 try{

  await deleteDocument(
   collectionName,
   id
  );

  alert("✅ Delete විය.");

  render();

 }catch(error){

  alert(
   "❌ Delete Error\n\n"+
   error.message
  );

 }

};
