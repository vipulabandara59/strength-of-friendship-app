<script>
'use strict';

const KEY='sof_final_firebase_v2';

const months=[
'ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්',
'මැයි','ජූනි','ජූලි','අගෝස්තු',
'සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'
];

const base={

 address:'A 1/10 මැදගොඩ අමිතිරිගල',

 logo:'',

 constitution:'',

 pdf:'',

 memberFee:'රු. 2,000',

 deathFee:'රු. 1,000',

 joinFee:'',

 sick:'',

 familySick:'',

 special:'',

 bankAccounts:[],

 paymentInfo:'',

 paymentForm:'',

 loanForm:'',

 qr:'',

 password:'1234',

 members:Array.from(
  {length:30},
  (_,i)=>({
   no:i+1,
   name:'',
   phone:'',
   photo:''
  })
 ),

 loans:[],

 payments:[],

 reports:[],

 accounts:[],

 memories:[],

 notices:[],

 attendance:[],

 calendar:Array.from(
  {length:12},
  ()=>({
   title:'',
   date:'',
   members:'',
   notes:''
  })
 ),

 next:[]

};

let D=loadData();

let ADMIN=false;

let current='home';

function clone(x){

 return JSON.parse(JSON.stringify(x));

}

function loadData(){

 try{

  const saved=JSON.parse(
   localStorage.getItem(KEY)
  );

  if(!saved)
   return clone(base);

  const data=clone(base);

  Object.keys(saved).forEach(k=>{
   data[k]=saved[k];
  });

  return data;

 }catch(error){

  return clone(base);

 }

}

/* =====================================================
   FIREBASE MAIN DATA
===================================================== */

async function loadFirebaseData(){

 if(!window.firebaseDB)
  return;

 try{

  const ref=window.firebaseDoc(
   window.firebaseDB,
   "appData",
   "main"
  );

  const snap=
   await window.firebaseGetDoc(ref);

  if(snap.exists()){

   const cloud=snap.data();

   const newData=clone(base);

   Object.keys(cloud).forEach(k=>{
    newData[k]=cloud[k];
   });

   D=newData;

   localStorage.setItem(
    KEY,
    JSON.stringify(D)
   );

   console.log(
    "Firebase main data loaded"
   );

  }else{

   await window.firebaseSetDoc(
    ref,
    D
   );

   console.log(
    "Initial Firebase data created"
   );

  }

  await loadMembers();

  render();

 }catch(error){

  console.error(
   "Firebase load error",
   error
  );

 }

}

/* =====================================================
   FIREBASE MEMBERS
===================================================== */

async function loadMembers(){

 if(!window.firebaseDB)
  return;

 try{

  const snap=
   await window.firebaseGetDocs(
    window.firebaseCollection(
     window.firebaseDB,
     "members"
    )
   );

  const list=[];

  snap.forEach(d=>{

   const x=d.data();

   list.push({
    no:x.no || 0,
    name:x.name || '',
    phone:x.phone || '',
    photo:x.photo || ''
   });

  });

  list.sort(
   (a,b)=>Number(a.no)-Number(b.no)
  );

  list.forEach(x=>{

   const index=
    Number(x.no)-1;

   if(index>=0 && index<D.members.length){

    D.members[index]={
     no:x.no,
     name:x.name,
     phone:x.phone,
     photo:x.photo
    };

   }

  });

  localStorage.setItem(
   KEY,
   JSON.stringify(D)
  );

 }catch(error){

  console.error(
   "Members load error",
   error
  );

 }

}

/* =====================================================
   FIREBASE SAVE MAIN
===================================================== */

async function firebaseSave(){

 if(!window.firebaseDB)
  return false;

 try{

  await window.firebaseSetDoc(
   window.firebaseDoc(
    window.firebaseDB,
    "appData",
    "main"
   ),
   D
  );

  console.log(
   "Firebase main data saved"
  );

  return true;

 }catch(error){

  console.error(
   "Firebase save error",
   error
  );

  alert(
   "❌ Firebase එකට Save කිරීමේදී ගැටලුවක් පවතී."
  );

  return false;

 }

}

/* =====================================================
   SAVE
===================================================== */

async function save(){

 localStorage.setItem(
  KEY,
  JSON.stringify(D)
 );

 await firebaseSave();

 render();

}

/* =====================================================
   HELPERS
===================================================== */

function e(x){

 return String(x??'').replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'
  }[m])
 );

}

function p(id){

 return document.getElementById(
  'p-'+id
 );

}

function go(x){

 current=x;

 render();

 window.scrollTo(0,0);

}

function openM(x){

 mb.innerHTML=x;

 modal.classList.add('a');

}

function closeM(){

 modal.classList.remove('a');

}

function req(){

 if(ADMIN)
  return true;

 login();

 return false;

}

/* =====================================================
   FILE READER
===================================================== */

function fd(file,callback){

 if(!file){

  callback('');

  return;

 }

 const reader=new FileReader();

 reader.onload=()=>{
  callback(reader.result);
 };

 reader.readAsDataURL(file);

}

/* =====================================================
   DELETE
===================================================== */

function del(type,index){

 if(!req())
  return;

 if(!confirm(
  'මෙය Delete කරන්නද?'
 ))
  return;

 if(
  !Array.isArray(D[type])
 )
  return;

 D[type].splice(index,1);

 save();

}

function member(i){

 if(!req())
  return;

 const x=D.members[i];

 openM(`

 <h2>සාමාජික අංකය ${x.no}</h2>

 <input
  id="mn"
  value="${e(x.name)}"
  placeholder="නම">

 <input
  id="mp"
  value="${e(x.phone)}"
  placeholder="දුරකථන අංකය">

 <input
  id="mf"
  type="file"
  accept="image/*">

 ${
  x.photo
  ? `<img
      class="preview"
      src="${x.photo}">`
  : ''
 }

 <button
  class="btn blue"
  onclick="sm(${i})">
  💾 Save
 </button>

 `);

}

function sm(i){

 D.members[i].name=
  document.getElementById('mn').value;

 D.members[i].phone=
  document.getElementById('mp').value;

 const file=
  document.getElementById('mf').files[0];

 fd(file,s=>{

  if(s)
   D.members[i].photo=s;

  saveMemberFirebase(i);

 });

}

async function saveMemberFirebase(i){

 if(!window.firebaseDB){

  save();

  closeM();

  return;

 }

 try{

  await window.firebaseSetDoc(
   window.firebaseDoc(
    window.firebaseDB,
    "members",
    String(D.members[i].no)
   ),
   D.members[i]
  );

  localStorage.setItem(
   KEY,
   JSON.stringify(D)
  );

  render();

  closeM();

  alert('✅ සාමාජික විස්තර Save විය.');

 }catch(error){

  console.error(error);

  alert(
   '❌ Member Firebase Save error'
  );

 }

}

 <label>

 </label>

 <input
  id="memfiles"
  type="file"
  accept="image/*"
  multiple>

 ${
  (x.photos||[]).length
  ? `<div class="gallery">
     ${
      x.photos.map(photo=>`
       <img src="${photo}">
      `).join('')
     }
     </div>`
  : ''
 }

 <button
  class="btn blue"
  onclick="saveMemory(${i})">

function saveMemory(i){

 const x=i<0
  ? {title:'',text:'',photos:[]}
  : D.memories[i];

 x.title=memtitle.value;
 x.text=memtext.value;

 const files=
  Array.from(
   memfiles.files
  );

 if(!files.length){

  if(i<0)
   D.memories.push(x);

  save();
  closeM();

  return;

 }

 let photos=[];
 let done=0;

 files.forEach(file=>{

  fd(file,s=>{

   if(s)
    photos.push(s);

   done++;

   if(done===files.length){

    x.photos=[
     ...(x.photos||[]),
     ...photos
    ];

    if(i<0)
     D.memories.push(x);

    save();

    closeM();

   }

  });

 });

}

  type="file"
  accept="image/*">

 <button
  class="btn blue"

 </button>

 `);

}

function saveNotice(i){

 const x=i<0
  ? {title:'',text:'',photo:''}
  : D.notices[i];

 x.title=nt.value;
 x.text=nx.value;

 fd(
  nf.files[0],
  s=>{

   if(s)
    x.photo=s;

   if(i<0)
    D.notices.push(x);

   save();

   closeM();

  }
 );

}

function attendance(){

  <p>
   සාමාජිකයෙකුට තමන්ගේ App එකෙන්
   තම පැමිණීම Mark කළ හැක.
  </p>

  <button
   class="btn green"
   onclick="markAttendance()">
   ✅ මගේ පැමිණීම Mark කරන්න
  </button>

 </div>

 ${
  ADMIN
  ? `

   <div class="card">

    <h3>📋 Attendance Records</h3>

    ${
     D.attendance.map((x,i)=>`

      <div class="card">

       <b>${e(x.memberName)}</b>

       <p>
        අංකය: ${e(x.memberNo)}
       </p>

       <p>
        📅 ${e(x.date)}
       </p>

       <p>
        ⏰ ${e(x.time)}
       </p>

       <button
        class="btn red"
        onclick="del('attendance',${i})">
        Delete
       </button>

      </div>

     `).join('')
    }

   </div>

  `
  : ''
 }

 `;

}

function markAttendance(){

 const options=
  D.members
  .filter(x=>x.name)
  .map(x=>`
   <option value="${e(x.no)}">
    ${e(x.no)} - ${e(x.name)}
   </option>
  `)
  .join('');

 if(!options){

  alert(
   'පළමුව සාමාජික විස්තර ඇතුළත් කරන්න.'
  );

  return;

 }

 openM(`

 <h2>✅ මගේ පැමිණීම</h2>

 <p>
 ඔබගේ සාමාජික අංකය සහ නම තෝරන්න.
 </p>

 <select id="attMember">
  <option value="">
   -- සාමාජිකයා තෝරන්න --
  </option>
  ${options}
 </select>

 <input
  id="attDate"
  type="date">

 <button
  class="btn green"
  onclick="saveAttendance()">
  ✅ පැමිණීම Mark කරන්න
 </button>

 `);

 attDate.value=
  new Date()
  .toISOString()
  .slice(0,10);

}

async function saveAttendance(){

 const no=
  attMember.value;

 if(!no){

  alert(
   'සාමාජිකයා තෝරන්න.'
  );

  return;

 }

 const member=
  D.members.find(
   x=>String(x.no)===String(no)
  );

 if(!member)
  return;

 const now=new Date();

 const record={

  memberNo:member.no,

  memberName:member.name,

  date:attDate.value,

  time:now.toLocaleTimeString(),

  id:
   String(member.no)+'_'+
   attDate.value

 };

 D.attendance.push(record);

 await save();

 closeM();

 alert(
  '✅ ඔබගේ පැමිණීම Mark කරන ලදී.'
 );

}

function settings(){

 if(!req())
  return;

 openM(`

 <h2>⚙️ Admin Settings</h2>

 <label>ලිපිනය</label>

 <input
  id="ga"
  value="${e(D.address)}">

 <textarea
  id="gc">${e(D.constitution)}</textarea>

 <label>ව්‍යවස්ථා PDF</label>

 <input
  id="gpdf"
  type="file"
  accept="application/pdf">

 <label>සාමාජික ගාස්තුව</label>

 <input
  id="gm"
  value="${e(D.memberFee)}">

 <label>මරණාධාර ගාස්තුව</label>

 <input
  id="gd"
  value="${e(D.deathFee)}">

 <label>ඇතුළත් වීමේ ගාස්තුව</label>

 <input
  id="gj"
  value="${e(D.joinFee)}">

 <label>අසනීප වූ විට</label>

 <textarea
  id="gs">${e(D.sick)}</textarea>

 <label>බිරිඳ / දරුවන් අසනීප වූ විට</label>

 <textarea
  id="gf">${e(D.familySick)}</textarea>

 <label>විශේෂ සටහන්</label>

 <textarea
  id="gx">${e(D.special)}</textarea>

 <hr>

 <h3>🌐 Online Payment</h3>

 <label>Online Payment විස්තර</label>

 <textarea
  id="gpay">${e(D.paymentInfo)}</textarea>

 <label>Payment Google Form Link</label>

 <input
  id="gform"
  value="${e(D.paymentForm)}">

 <label>Loan Google Form Link</label>

 <input
  id="gloan"
  value="${e(D.loanForm)}">

 <label>Payment QR Code</label>

 <input
  id="gqr"
  type="file"
  accept="image/*">

 ${
  D.qr
  ? `<img
      class="preview"
      src="${D.qr}">`
  : ''
 }

 <hr>

 <label>Admin Password</label>

 <input
  id="gp"
  type="password"
  value="${e(D.password)}">

 <button
  class="btn blue"
  onclick="saveSettings()">
  💾 Save All
 </button>

 `);

}

function saveSettings(){

 if(!ADMIN)
  return;

 D.address=ga.value;

 D.constitution=gc.value;

 D.memberFee=gm.value;

 D.deathFee=gd.value;

 D.joinFee=gj.value;

 D.sick=gs.value;

 D.familySick=gf.value;

 D.special=gx.value;

 D.paymentInfo=gpay.value;

 D.paymentForm=gform.value;

 D.loanForm=gloan.value;

 D.password=
  gp.value || '1234';

 let files=[];

 if(gpdf.files[0])
  files.push({
   type:'pdf',
   file:gpdf.files[0]
  });

 if(gqr.files[0])
  files.push({
   type:'qr',
   file:gqr.files[0]
  });

 if(!files.length){

  save();

  closeM();

  return;

 }

 let done=0;

 files.forEach(item=>{

  fd(item.file,s=>{

   if(item.type==='pdf')
    D.pdf=s;

   if(item.type==='qr')
    D.qr=s;

   done++;

   if(done===files.length){

    save();

    closeM();

   }

  });

 });

}

function backup(){

 if(!req())
  return;

 const blob=
  new Blob(
   [JSON.stringify(D,null,2)],
   {type:'application/json'}
  );

 const a=
  document.createElement('a');

 a.href=
  URL.createObjectURL(blob);

 a.download=
  'strength-of-friendship-backup.json';

 a.click();

}
